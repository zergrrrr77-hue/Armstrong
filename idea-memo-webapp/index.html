<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>아이디어 메모장</title>
  <meta name="description" content="언제 어디서나 떠오른 아이디어를 빠르게 기록하는 메모장" />
  <meta name="theme-color" content="#4f46e5" />

  <!-- 이 태그가 있어야 브라우저가 "홈 화면에 추가"를 할 수 있어요 (PWA의 핵심 파일) -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>💡 아이디어 메모장</h1>
  </header>

  <main class="app-main">
    <!-- 타이핑하는 즉시(엔터 없이) 제목/내용에서 찾아주는 검색창 -->
    <input
      type="search"
      id="search-input"
      class="search-input"
      placeholder="🔍 제목이나 내용으로 검색"
      aria-label="메모 검색"
    />

    <!-- 지금까지 쓴 태그들이 여기 버튼으로 나열돼요. 누르면 그 태그가 붙은 메모만 보여요. -->
    <div class="tag-filter" id="tag-filter"></div>

    <div class="toolbar">
      <label class="sort-label">
        정렬
        <select id="sort-select">
          <option value="newest">최신순</option>
          <option value="oldest">오래된순</option>
          <option value="title">제목순</option>
        </select>
      </label>
      <p class="memo-count" id="memo-count"></p>
    </div>

    <!-- 메모가 없을 때(또는 검색/태그 조건에 맞는 게 없을 때) 이 문구가 보여요 -->
    <p class="empty-state" id="empty-state"></p>

    <div class="memo-list" id="memo-list"></div>
  </main>

  <!-- 퀵캡처용 플로팅 버튼: 화면 어디서든 눌러서 바로 새 메모 작성 -->
  <button class="fab" id="fab-btn" type="button" aria-label="새 메모 작성">+</button>

  <!-- 메모 작성/수정 창. <dialog>는 브라우저가 기본으로 지원하는 "팝업 창" 태그예요. -->
  <dialog class="memo-dialog" id="memo-dialog">
    <form id="memo-form">
      <h2 id="dialog-heading">새 메모</h2>

      <label class="field">
        제목
        <input type="text" id="memo-title-input" maxlength="80" placeholder="제목을 입력하세요" required />
      </label>

      <label class="field">
        내용
        <textarea id="memo-content-input" rows="6" placeholder="자유롭게 적어보세요"></textarea>
      </label>

      <label class="field">
        태그
        <input
          type="text"
          id="memo-tags-input"
          placeholder="쉼표로 구분해서 입력 (예: 아이디어, 할일)"
        />
      </label>

      <div class="dialog-actions">
        <button type="button" id="dialog-cancel-btn" class="btn btn-ghost">취소</button>
        <button type="submit" class="btn btn-primary">저장</button>
      </div>
    </form>
  </dialog>

  <script src="js/storage.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
