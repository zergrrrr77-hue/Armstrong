<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>아이디어 메모장</title>
  <meta name="description" content="언제 어디서나 떠오른 아이디어를 빠르게 기록하는 메모장" />
  <meta name="theme-color" content="#4f46e5" />

  <!-- 이 태그가 있어야 브라우저가 "홈 화면에 추가"를 할 수 있어요 (PWA의 핵심 파일) -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>💡 아이디어 메모장</h1>
  </header>

  <main class="app-main">
    <p class="placeholder">
      지금은 기본 틀(뼈대)만 만들어진 상태예요.<br />
      다음 단계에서 메모를 쓰고 저장하는 기능을 추가할 거예요.
    </p>
  </main>

  <!-- 퀵캡처용 플로팅 버튼. 지금은 기능이 없어서 눌러도 반응 없음(비활성화) -->
  <button class="fab" type="button" aria-label="새 메모 작성" disabled>+</button>

  <script src="js/app.js" defer></script>
</body>
</html>
