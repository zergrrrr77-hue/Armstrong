<title>잊혀진 대장간</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 화면 전체가 게임. 세로 모바일은 위 = 게임, 아래 = 컨트롤 패널. 가방·타이틀은 대장간 철판 패널 */
:root{
  color-scheme:dark;
  --bg:#0b0a10;
  --panel:#1b1720;
  --panel-2:#252029;
  --fg:#efe6d8;
  --muted:#9b8f86;
  --line:#3d342f;
  --ember:#ff9a1f;
  --ember-dim:#7a3f12;
  --good:#5fd068;
  --bad:#ff6b5e;
  --font-display:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --ctrl-top:100%;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0;display:block;width:100%;height:100%}
button{font-family:var(--font-display);color:var(--fg);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

/* 타이틀 */
#title{position:fixed;inset:0;display:grid;place-items:center;overflow:auto;background:radial-gradient(ellipse at 50% 75%,rgba(255,120,30,.22),transparent 60%),rgba(8,7,10,.72);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;z-index:20}
.title-card{display:grid;gap:16px;justify-items:center;text-align:center;max-width:480px}
.title-card h1{font-family:var(--font-display);font-weight:400;font-size:clamp(40px,9vw,72px);margin:0;letter-spacing:.04em;color:var(--fg);text-shadow:0 0 22px rgba(255,140,40,.6),0 4px 0 var(--ember-dim);text-wrap:balance}
.title-card .sub{color:var(--muted);margin:0;font-size:14px;letter-spacing:.06em}
.title-btns{display:grid;gap:10px;width:min(280px,100%)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-bottom:3px solid #120f13;padding:11px 16px;font-size:20px;border-radius:4px}
.btn:hover{border-color:var(--ember)}
.btn.primary{background:linear-gradient(#5a2c0d,#3a1c08);border-color:var(--ember-dim);color:#ffd9a8}
.btn.small{font-size:15px;padding:7px 12px}
.keys{display:grid;grid-template-columns:auto auto;gap:4px 14px;font-size:13px;color:var(--muted);text-align:left}
.keys b{font-family:var(--font-display);font-weight:400;color:var(--fg);letter-spacing:.04em}
.dev-toggle{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.confirm{display:grid;gap:8px;justify-items:center;font-size:14px}
.confirm div{display:flex;gap:8px}

/* 가방 */
#inv{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,4,8,.66);z-index:15;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-bottom,0px))}
.inv-wrap{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--ember-dim);border-radius:6px;width:min(860px,100%);height:min(560px,100%);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.inv-head{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.inv-head h2{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0;letter-spacing:.04em}
.inv-head .meta{color:var(--muted);font-size:13px;flex:1;font-variant-numeric:tabular-nums;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-body{display:grid;grid-template-columns:190px minmax(0,1fr) 260px;grid-template-areas:"equip grid detail";gap:12px;padding:12px;min-height:0}
.inv-body>section{min-height:0;overflow:auto;min-width:0}
.sec-equip{grid-area:equip}.sec-grid{grid-area:grid}.sec-detail{grid-area:detail}
@media (max-width:700px){
  .inv-body{grid-template-columns:minmax(0,1fr);grid-template-rows:max-content max-content max-content;grid-template-areas:"detail" "grid" "equip";align-content:start;overflow:auto}
  .inv-body>section{overflow:visible}
}
.col-title{font-family:var(--font-display);font-size:13px;color:var(--muted);letter-spacing:.12em;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.col-title button{font-size:12px;padding:3px 8px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;letter-spacing:0}
.equip{display:grid;gap:6px;align-content:start}
.eslot{display:flex;gap:8px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:5px;min-width:0;text-align:left}
.eslot img{width:32px;height:32px;image-rendering:pixelated;flex:none;object-fit:contain}
.eslot .lbl{font-size:11px;color:var(--muted)}
.eslot .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px;margin-top:8px;font-variant-numeric:tabular-nums}
.stats span:nth-child(odd){color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px;align-content:start}
.slot{aspect-ratio:1;max-width:100%;background:#141117;border:2px solid var(--line);border-radius:4px;display:grid;place-items:center;position:relative;padding:0;overflow:hidden}
.slot img{width:34px;height:34px;image-rendering:pixelated;object-fit:contain}
.slot.sel{outline:2px solid var(--fg);outline-offset:1px}
.slot .tag{position:absolute;left:3px;top:1px;font-size:11px;color:var(--ember);font-family:var(--font-display)}
.slot .tier{position:absolute;right:3px;top:1px;font-size:11px;font-family:var(--font-display)}
.slot .up{position:absolute;right:3px;bottom:0;font-size:12px;color:var(--good)}
.slot.empty{border-style:dashed;opacity:.3}
.detail{display:grid;gap:10px;align-content:start;min-width:0}
.d-head{display:flex;gap:10px;align-items:center}
.d-icon{width:64px;height:64px;flex:none;border:2px solid var(--line);border-radius:6px;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%),#141117;display:grid;place-items:center}
.d-icon img{width:52px;height:52px;image-rendering:pixelated;object-fit:contain}
.detail h3{font-family:var(--font-display);font-weight:400;font-size:21px;margin:0;text-wrap:balance}
.detail .rar{font-size:12px;letter-spacing:.06em;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-family:var(--font-display);font-size:12px;padding:1px 6px;border-radius:3px;border:1px solid currentColor}
.detail p{margin:0;font-size:13px;line-height:1.5;color:#d6ccbf}
.stbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.stbl th{font-weight:400;color:var(--muted);text-align:left;padding:4px 0;border-bottom:1px solid #2c2529}
.stbl td{padding:4px 0;border-bottom:1px solid #2c2529;text-align:right}
.stbl .rng{color:#6f655e;font-size:11px;padding-left:6px}
.stbl .pos{color:var(--good)}.stbl .neg{color:var(--bad)}
.fx{font-size:12px;color:#ffd9a8;background:#2a1d14;border:1px solid #4a321e;border-radius:4px;padding:6px 8px;line-height:1.45}
.wt{font-size:12px;color:#bcd6ff;line-height:1.45}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.mats{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}

/* 빠른 장착 */
#quick{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:11;background:rgba(20,16,22,.82);border:1px solid var(--line);border-radius:6px;padding:8px 14px;font-size:15px;display:flex;gap:8px;align-items:center;max-width:calc(100% - 200px);white-space:nowrap;overflow:hidden;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#quick kbd{font-family:var(--font-display);background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:0 6px}
body.touch #quick kbd{display:none}
body.touch #quick{top:calc(10px + env(safe-area-inset-top,0px));bottom:auto}
body.portrait #quick{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 40px)}

/* 터치 컨트롤: 배경에 녹아드는 반투명 유리 */
#touch{position:fixed;inset:0;pointer-events:none;z-index:9}
#joy{position:absolute;left:0;bottom:0;width:50%;height:65%;pointer-events:auto;touch-action:none}
.joy-base{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1.5px solid rgba(255,255,255,.22);background:radial-gradient(circle,rgba(255,255,255,.07) 0%,rgba(255,255,255,.02) 60%,transparent 70%);pointer-events:none;transition:opacity .2s}
.joy-base.idle{opacity:.4}
.joy-knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.32),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.tb{pointer-events:auto;position:absolute;border-radius:50%;touch-action:none;display:grid;place-items:center;line-height:1;color:rgba(255,255,255,.88);text-shadow:0 1px 3px rgba(0,0,0,.7);background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.14),rgba(255,255,255,.03) 62%,rgba(0,0,0,.08));border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);transition:transform .06s,background .1s}
.tb.on{transform:scale(.92);background:radial-gradient(circle,rgba(255,214,160,.38),rgba(255,170,80,.08) 70%);border-color:rgba(255,226,180,.55)}
.tb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.tb img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7));opacity:.92;pointer-events:none}
.t-atk{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:84px;height:84px}
.t-jump{right:calc(118px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:60px;height:60px}
.t-auto{right:calc(110px + env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:58px;height:30px;border-radius:15px!important;font-family:var(--font-display);font-size:12px}
.t-auto.active{color:#ffd9a8;border-color:rgba(255,200,140,.6);background:radial-gradient(circle,rgba(255,170,80,.3),rgba(255,140,40,.06) 70%)}
.t-inv{right:calc(14px + env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));width:44px;height:44px;border-radius:12px!important}
body.portrait .t-atk{width:92px;height:92px;bottom:calc(44px + env(safe-area-inset-bottom,0px))}
body.portrait .t-jump{width:64px;height:64px;bottom:calc(28px + env(safe-area-inset-bottom,0px));right:calc(126px + env(safe-area-inset-right,0px))}
body.portrait .t-auto{bottom:calc(114px + env(safe-area-inset-bottom,0px));right:calc(118px + env(safe-area-inset-right,0px))}
body.portrait .t-inv{top:calc(96px + env(safe-area-inset-top,0px))}

/* 캐릭터 만들기 */
#create{position:fixed;inset:0;display:grid;place-items:center;overflow:auto;background:radial-gradient(ellipse at 50% 70%,rgba(255,120,30,.18),transparent 60%),rgba(8,7,10,.82);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;z-index:21}
.create-card{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--ember-dim);border-radius:8px;width:min(620px,100%);display:grid;gap:14px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.create-card h2{font-family:var(--font-display);font-weight:400;font-size:24px;margin:0;letter-spacing:.04em}
.create-body{display:grid;grid-template-columns:180px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:520px){.create-body{grid-template-columns:minmax(0,1fr);justify-items:center}}
#preview{width:180px;height:220px;max-width:100%;border-radius:6px;background:radial-gradient(circle at 50% 60%,#3a2c3a,#17131b 70%);border:1px solid var(--line)}
.opts{display:grid;gap:10px;width:100%;min-width:0}
.opt-row{display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.opt-row input{font:inherit;font-size:16px;color:var(--fg);background:#141117;border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%;user-select:text;-webkit-user-select:text;touch-action:auto}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:7px 0;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;font-size:16px}
.seg button.on{background:linear-gradient(#5a2c0d,#3a1c08);border-color:var(--ember);color:#ffd9a8}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.15);padding:0}
.sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--ember)}
.create-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
</style>

<canvas id="game" aria-label="잊혀진 대장간 게임 화면"></canvas>

<div id="title">
  <div class="title-card">
    <h1>잊혀진 대장간</h1>
    <p class="sub">폐허 마을 · 프로토타입 v0.3</p>
    <div class="title-btns" id="titleBtns">
      <button class="btn primary" id="btnContinue" hidden>이어하기</button>
      <button class="btn" id="btnNew">새로 시작</button>
    </div>
    <div class="confirm" id="confirmNew" hidden>
      <span>저장된 진행이 지워집니다. 새로 시작할까요?</span>
      <div><button class="btn small primary" id="btnNewYes">새로 시작</button><button class="btn small" id="btnNewNo">취소</button></div>
    </div>
    <div class="keys" id="keysPc">
      <b>A D · ← →</b><span>이동</span>
      <b>W · Space</b><span>점프 (S + 점프: 발판 아래로)</span>
      <b>J (길게)</b><span>공격 · 연속 공격</span>
      <b>Q</b><span>자동 공격 켜기/끄기</span>
      <b>I · Tab</b><span>가방 · 능력치</span>
      <b>E</b><span>방금 주운 더 좋은 장비 바로 장착</span>
    </div>
    <div class="keys" id="keysTouch" hidden>
      <b>왼쪽 화면 드래그</b><span>이동 (아래로 당기고 점프: 발판 아래로)</span>
      <b>공격 길게 누르기</b><span>연속 공격</span>
      <b>자동</b><span>가까운 적을 자동으로 공격</span>
      <b>가방</b><span>장비 · 능력치 창</span>
    </div>
    <label class="dev-toggle"><input type="checkbox" id="devToggle"> 개발 모드: 드롭 100% · 전설 확률 10% (F2)</label>
  </div>
</div>

<div id="inv" hidden>
  <div class="inv-wrap" role="dialog" aria-label="가방">
    <div class="inv-head">
      <h2>가방</h2>
      <span class="meta" id="invMeta"></span>
      <button class="btn small" id="invClose">닫기</button>
    </div>
    <div class="inv-body">
      <section class="sec-equip">
        <p class="col-title">장착 중</p>
        <div class="equip" id="invEquip"></div>
        <div class="stats" id="invStats"></div>
        <div class="mats" id="invMats"></div>
      </section>
      <section class="sec-grid">
        <p class="col-title"><span>소지품 <span id="invCount"></span></span><button id="invSort">등급순 정렬</button></p>
        <div class="grid" id="invGrid"></div>
      </section>
      <section class="sec-detail detail" id="invDetail"></section>
    </div>
  </div>
</div>

<button id="quick" hidden><kbd>E</kbd><span id="quickText"></span></button>

<div id="touch" hidden>
  <div id="joy"><div class="joy-base idle" id="joyBase"><div class="joy-knob" id="joyKnob"></div></div></div>
  <button class="tb t-atk" data-k="attack" aria-label="공격"><img id="atkIcon" alt=""></button>
  <button class="tb t-jump" data-k="jump" aria-label="점프"><svg viewBox="0 0 24 24"><path d="M6 13l6-6 6 6"/><path d="M6 19l6-6 6 6" opacity=".5"/></svg></button>
  <button class="tb t-auto" id="tAuto">자동</button>
  <button class="tb t-inv" id="tInv" aria-label="가방"><svg viewBox="0 0 24 24"><path d="M5 9h14l-1.2 11H6.2z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/></svg></button>
</div>

<div id="create" hidden>
  <div class="create-card" role="dialog" aria-label="모험가 만들기">
    <h2>모험가 만들기</h2>
    <div class="create-body">
      <canvas id="preview" width="360" height="440" aria-label="캐릭터 미리보기"></canvas>
      <div class="opts">
        <label class="opt-row"><span>이름</span><input id="heroName" maxlength="8" placeholder="모험가" autocomplete="off"></label>
        <div class="opt-row"><span>성별</span><div class="seg" id="optGender"><button data-v="m">남</button><button data-v="f">여</button></div></div>
        <div class="opt-row"><span>머리색</span><div class="sw" id="optHair"></div></div>
        <div class="opt-row"><span>피부색</span><div class="sw" id="optSkin"></div></div>
        <div class="opt-row"><span>눈동자</span><div class="sw" id="optEye"></div></div>
        <div class="opt-row"><span>옷 색</span><div class="sw" id="optOutfit"></div></div>
      </div>
    </div>
    <div class="create-acts">
      <button class="btn small" id="optRandom">무작위</button>
      <button class="btn small" id="createBack">뒤로</button>
      <button class="btn primary" id="createGo">모험 시작</button>
    </div>
  </div>
</div>

<script>
(() => {

  if (mode === 'play' || mode === 'inv') drawHUD();
  ctx.restore();
}

// ───────────────────────── 가방 UI ─────────────────────────
let invSel = 0;
function openInv() {
  mode = 'inv'; for (const k in held) held[k] = false; joyReset();
  const i = S.inv.findIndex((x) => x.uid === lastBetter); invSel = i >= 0 ? i : 0;
  $('inv').hidden = false; renderInv();
}
function closeInv() { $('inv').hidden = true; mode = 'play'; }
$('invClose').addEventListener('click', closeInv);
$('inv').addEventListener('pointerdown', (e) => { if (e.target.id === 'inv') closeInv(); });
$('invSort').addEventListener('click', () => {
  const sel = S.inv[invSel];
  S.inv.sort((a, b) => (RORDER.indexOf(ITEMS[b.id].r) - RORDER.indexOf(ITEMS[a.id].r)) || (b.tier - a.tier) || (score(b) - score(a)));
  invSel = Math.max(0, S.inv.indexOf(sel)); save(); renderInv();
});
function invKey(a) {
  const cols = Math.max(1, Math.floor(($('invGrid').clientWidth + 6) / 56));
  if (a === 'inv' || a === 'esc') { closeInv(); return; }
  if (a === 'left') invSel--; else if (a === 'right') invSel++;
  else if (a === 'jump') invSel -= cols; else if (a === 'down') invSel += cols;
  else if (a === 'attack' || a === 'enter' || a === 'quick') { const it = S.inv[invSel]; if (it) equip(it.uid); }
  else if (a === 'salvage') { const it = S.inv[invSel]; if (it) salvage(it.uid); }
  invSel = clamp(invSel, 0, Math.max(0, S.inv.length - 1));
  renderInv();
}
function fmt(k, v) { return PCT[k] ? `${v}%` : `${v}`; }
function iconSrc(id) { itemIcon(id); return iconURL[id]; }
function renderInv() {
  const st = stats();
  $('invMeta').textContent = `Lv ${S.level} · ${S.gold} G`;
  $('invEquip').innerHTML = ['weapon', 'armor', 'ring'].map((slot) => {
    const inst = eqInst(slot);
    if (!inst) return `<div class="eslot"><div style="width:32px;height:32px;border:1px dashed var(--line);border-radius:3px"></div><div><div class="lbl">${SLOT_NAME[slot]}</div><div class="nm" style="color:var(--muted)">비어 있음</div></div></div>`;
    const it = ITEMS[inst.id], tc = TIERS[inst.tier];
    return `<button class="eslot" data-uid="${inst.uid}" style="border-color:${RARITY[it.r].color}66"><img src="${iconSrc(inst.id)}" alt=""><div style="min-width:0"><div class="lbl">${SLOT_NAME[slot]}${it.wt ? ' · ' + WT[it.wt].name : ''} · <span style="color:${tc.color}">${tc.name}</span></div><div class="nm" style="color:${RARITY[it.r].color}">${it.name}</div></div></button>`;
  }).join('');
  $('invEquip').querySelectorAll('[data-uid]').forEach((b) => b.addEventListener('click', () => { invSel = S.inv.findIndex((x) => x.uid === +b.dataset.uid); renderInv(); }));
  $('invStats').innerHTML = [['공격력', st.atk], ['방어력', st.def], ['최대 체력', st.maxHp], ['치명타', st.crit + '%'], ['회피율', st.eva + '%'], ['이동 속도', Math.round(st.spd * 100) + '%'], ['초당 회복', st.regen]].map(([a, b]) => `<span>${a}</span><span>${b}</span>`).join('');
  $('invMats').innerHTML = Object.keys(MATS).map((k) => `<span>${MATS[k]} ${S.mats[k]}</span>`).join('');
  $('invCount').textContent = `${S.inv.length}/24`;
  const eqUids = Object.values(S.eq);
  let html = S.inv.map((inst, i) => {
    const it = ITEMS[inst.id], tc = TIERS[inst.tier];
    const better = !eqUids.includes(inst.uid) && score(inst) > score(eqInst(it.slot));
    return `<button class="slot${i === invSel ? ' sel' : ''}" data-i="${i}" style="border-color:${RARITY[it.r].color}" aria-label="${it.name}"><img src="${iconSrc(inst.id)}" alt="">${eqUids.includes(inst.uid) ? '<span class="tag">E</span>' : ''}<span class="tier" style="color:${tc.color}">${tc.short}</span>${better ? '<span class="up">▲</span>' : ''}</button>`;
  }).join('');
  for (let i = S.inv.length; i < 24; i++) html += '<div class="slot empty"></div>';
  $('invGrid').innerHTML = html;
  $('invGrid').querySelectorAll('.slot[data-i]').forEach((b) => b.addEventListener('click', () => { invSel = +b.dataset.i; renderInv(); }));
  renderDetail(eqUids);
}
// 능력치 창: 굴린 수치 + 등급 범위 + 장착 중인 장비와 비교
function renderDetail(eqUids) {
  const inst = S.inv[invSel];
  if (!inst) { $('invDetail').innerHTML = '<p class="col-title">능력치</p><p>장비를 누르면 능력치가 여기에 표시됩니다.</p>'; return; }
  const it = ITEMS[inst.id], rc = RARITY[it.r], tc = TIERS[inst.tier], isEq = eqUids.includes(inst.uid);
  const cur = eqInst(it.slot), curSt = cur && !isEq ? cur.st : null;
  const order = Object.keys(STAT_NAME);
  const keys = [...new Set([...Object.keys(it.st), ...(curSt ? Object.keys(curSt) : [])])].sort((a, b) => order.indexOf(a) - order.indexOf(b));
  const rows = keys.map((k) => {
    const v = inst.st[k] || 0, rng = it.st[k], d = curSt ? v - (curSt[k] || 0) : 0;
    const diff = !curSt ? '' : d > 0 ? `<span class="pos">▲${fmt(k, d)}</span>` : d < 0 ? `<span class="neg">▼${fmt(k, -d)}</span>` : '<span style="color:var(--muted)">=</span>';
    return `<tr><th>${STAT_NAME[k]}</th><td>${rng ? fmt(k, v) : '-'}${rng && rng[0] !== rng[1] ? `<span class="rng">${fmt(k, rng[0])}~${fmt(k, rng[1])}</span>` : ''}</td><td style="width:62px">${diff}</td></tr>`;
  }).join('');
  const sell = Math.round(rc.sell * (1 + inst.tier * 0.5));
  $('invDetail').innerHTML = `
    <p class="col-title">능력치</p>
    <div class="d-head"><div class="d-icon" style="border-color:${rc.color}"><img src="${iconSrc(inst.id)}" alt=""></div>
      <div style="min-width:0;display:grid;gap:4px"><div class="rar"><span style="color:${rc.color}">${rc.name}</span><span style="color:var(--muted)">${SLOT_NAME[it.slot]}${it.wt ? ' · ' + WT[it.wt].name : ''}</span><span class="chip" style="color:${tc.color}">${tc.name}</span></div>
      <h3 style="color:${rc.color}">${it.name}</h3></div></div>
    <p>${it.desc}</p>
    <table class="stbl"><tbody>${rows}</tbody></table>
    ${curSt ? `<span style="color:var(--muted);font-size:11px">비교 대상: ${ITEMS[cur.id].name} [${TIERS[cur.tier].short}]</span>` : isEq ? '<span style="color:var(--ember);font-size:12px">장착 중</span>' : ''}
    ${it.wt ? `<div class="wt">${WT[it.wt].name} 계열 · ${WT[it.wt].desc}</div>` : ''}
    ${it.fxText ? `<div class="fx">고유 효과 · ${it.fxText}</div>` : ''}
    <div class="acts">
      ${isEq ? '' : '<button class="btn small primary" id="actEquip">장착</button>'}
      ${isEq ? '' : `<button class="btn small" id="actSell">분해 +${sell}G</button>`}
    </div>`;
  const eb = $('actEquip'); if (eb) eb.addEventListener('click', () => { equip(inst.uid); renderInv(); });
  const sb = $('actSell'); if (sb) sb.addEventListener('click', () => { salvage(inst.uid); invSel = clamp(invSel, 0, S.inv.length - 1); renderInv(); });
}
function syncQuick() {
  const show = mode === 'play' && lastBetter && itemByUid(lastBetter);
  $('quick').hidden = !show;
  if (show) {
    const inst = itemByUid(lastBetter), it = ITEMS[inst.id];
    const txt = `장착: [${TIERS[inst.tier].short}] ${it.name}`;
    if ($('quickText').textContent !== txt) { $('quickText').textContent = txt; $('quick').style.borderColor = RARITY[it.r].color; }
  }
}
$('quick').addEventListener('click', () => { if (lastBetter) equip(lastBetter); });

// ───────────────────────── 타이틀 ─────────────────────────
function startGame(state) {
  S = state; resetWorld(); mode = 'play';
  $('title').hidden = true; $('touch').hidden = !isTouch; syncAutoBtn(); syncAtkBtn(); joyReset();
  $('devToggle').checked = S.dev;
  lastZone = zoneIndex(P.x); zoneTitle = { name: ZONES[lastZone].name, t: 2.6 };
  toast(S.migrated ? '이전 저장을 새 장비 체계로 옮겼다 (중급 능력치)' : S.level > 1 || S.inv.length > 1 ? '저장된 진행을 불러왔다' : '폐허 마을에서 눈을 떴다. 오른쪽으로 가 보자.', '#c9b79c');
  delete S.migrated;
  save();
}
if (isTouch) { $('keysPc').hidden = true; $('keysTouch').hidden = false; }
if (loadSave()) $('btnContinue').hidden = false;
$('btnContinue').addEventListener('click', () => { initAudio(); const s = loadSave() || freshState(); s.dev = $('devToggle').checked; startGame(s); });
$('btnNew').addEventListener('click', () => {
  initAudio();
  if (loadSave()) { $('confirmNew').hidden = false; $('titleBtns').hidden = true; return; }
  openCreate();
});
$('btnNewYes').addEventListener('click', openCreate);

// ───────────────────────── 캐릭터 만들기 ─────────────────────────
let draftLook = defaultLook();
const pv = $('preview'), pvx = pv.getContext('2d');
const LOOK_KEYS = [['optHair', 'hair'], ['optSkin', 'skin'], ['optEye', 'eye'], ['optOutfit', 'outfit']];
for (const [id, key] of LOOK_KEYS) {
  $(id).innerHTML = LOOK_OPTS[key].map((c, i) => `<button data-i="${i}" style="background:${c}" aria-label="${LOOK_LABEL[key][i]}"></button>`).join('');
  $(id).querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { draftLook[key] = +b.dataset.i; syncCreate(); }));
}
$('optGender').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { draftLook.gender = b.dataset.v; syncCreate(); }));
$('optRandom').addEventListener('click', () => { draftLook = { gender: Math.random() < 0.5 ? 'm' : 'f', hair: randi(0, 6), skin: randi(0, 4), eye: randi(0, 4), outfit: randi(0, 5) }; syncCreate(); });
function syncCreate() {
  $('optGender').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.v === draftLook.gender));
  for (const [id, key] of LOOK_KEYS) $(id).querySelectorAll('button').forEach((b) => b.classList.toggle('on', +b.dataset.i === draftLook[key]));
}
function openCreate() { mode = 'create'; $('title').hidden = true; $('confirmNew').hidden = true; $('titleBtns').hidden = false; $('create').hidden = false; syncCreate(); }
$('createBack').addEventListener('click', () => { $('create').hidden = true; $('title').hidden = false; mode = 'title'; });
$('createGo').addEventListener('click', () => {
  const s = freshState(); s.look = Object.assign({}, draftLook);
  s.name = ($('heroName').value.trim() || '모험가').slice(0, 8); s.dev = $('devToggle').checked;
  $('create').hidden = true; startGame(s);
});
function drawPreview() {
  const fr = heroFrames(draftLook, null), phase = Math.floor(time / 1.6) % 2;
  const pn = phase ? 'run' + (Math.floor(time * 10) % 6) : 'idle' + (Math.floor(time * 3) % 4), spr = fr[pn];
  pvx.setTransform(1, 0, 0, 1, 0, 0); pvx.clearRect(0, 0, pv.width, pv.height); pvx.imageSmoothingEnabled = false;
  pvx.fillStyle = 'rgba(0,0,0,.35)'; pvx.beginPath(); pvx.ellipse(180, 404, 80, 12, 0, 0, Math.PI * 2); pvx.fill();
  pvx.translate(180, 410); pvx.scale(6.5, 6.5);
  const w = weaponSprite('rusty'); pvx.save(); pvx.translate(HERO_POSES[pn].hand[0], HERO_POSES[pn].hand[1]); pvx.rotate(-1.95); pvx.drawImage(w.img, -w.ax, -w.ay); pvx.restore();
  pvx.drawImage(spr.img, -spr.ax, -spr.ay);
}
$('btnNewNo').addEventListener('click', () => { $('confirmNew').hidden = true; $('titleBtns').hidden = false; });

// ───────────────────────── 메인 루프 ─────────────────────────
let last = performance.now();
function boot() {
  buildSprites();
  buildBackgrounds();
  mode = 'title';
  resetWorld();
  resize();
  last = performance.now();
  requestAnimationFrame(frame);
}
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (mode === 'play') update(dt);
  else if (mode === 'title' || mode === 'create') { if (mode === 'create') drawPreview(); time += dt; cam.x = (Math.sin(time * 0.04) * 0.5 + 0.5) * 3600; cam.y = camYTarget(); updateFx(dt); ambient(dt); updateUiFx(dt); }
  else updateUiFx(dt);
  for (const k in pressed) pressed[k] = false;
  syncQuick();
  render();
  requestAnimationFrame(frame);
}
Promise.all(Object.values(sheetImg).map((im) => im.decode().catch(() => {}))).then(boot);
// 자동 테스트·디버그용 읽기 창구
window.__forge = { get S() { return S; }, get P() { return P; }, get enemies() { return enemies; }, get drops() { return drops; }, get mode() { return mode; }, rollInst, equip };
if (document.fonts && document.fonts.load) document.fonts.load('12px "Do Hyeon"').catch(() => {});
})();
</script>
